<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>輔大課程查找 Lite+</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">FJU Course Recommender Lite+</p>
        <h1>課程搜尋</h1>
        <p id="termText" class="muted">讀取學期資料中…</p>
      </div>
      <div class="hero-actions">
        <button id="openScheduleBtn" class="secondary">開啟獨立課表 <span id="scheduleCount">0</span></button>
        <button id="refreshBtn" class="secondary">更新課程資料</button>
      </div>
    </header>

    <section class="panel search-panel">
      <div class="search-primary">
        <label class="field search-field">
          <span>搜尋課程</span>
          <input id="searchInput" type="search" placeholder="課名、英文課名、課號、教師、系所、標籤" autocomplete="off" />
        </label>
        <button id="searchBtn">搜尋</button>
      </div>

      <div class="quick-filter-grid">
        <label class="field">
          <span>系所</span>
          <select id="departmentSelect"><option value="">全部系所</option></select>
        </label>
        <label class="field">
          <span>星期</span>
          <select id="weekdaySelect">
            <option value="">全部星期</option>
            <option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option>
            <option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="7">星期日</option>
          </select>
        </label>
        <label class="field">
          <span>節次</span>
          <select id="sectionSelect"><option value="">全部節次</option></select>
        </label>
        <label class="field">
          <span>學分</span>
          <select id="creditsSelect"><option value="">不限學分</option></select>
        </label>
        <label class="field">
          <span>必／選修</span>
          <select id="reqSelect"><option value="">全部</option></select>
        </label>
      </div>

      <details class="advanced-filter" id="advancedFilters">
        <summary>更多篩選條件 <span id="advancedCount" class="badge neutral-badge">0</span></summary>
        <div class="filter-grid advanced-grid">
          <label class="field">
            <span>開課部別</span>
            <select id="divisionSelect"><option value="">全部部別</option></select>
          </label>
          <label class="field">
            <span>年級</span>
            <select id="gradeSelect"><option value="">全部年級</option></select>
          </label>
          <label class="field">
            <span>課程標籤</span>
            <select id="courseTagSelect"><option value="">全部標籤</option></select>
          </label>
          <label class="field">
            <span>教師</span>
            <input id="teacherInput" list="teacherOptions" placeholder="輸入教師姓名" />
            <datalist id="teacherOptions"></datalist>
          </label>
          <label class="field">
            <span>班別</span>
            <select id="classSelect"><option value="">全部班別</option></select>
          </label>
          <label class="field">
            <span>上課時段</span>
            <select id="timeOfDaySelect">
              <option value="all">不限</option>
              <option value="daytime">日間 D 節</option>
              <option value="evening">晚間 E 節</option>
              <option value="weekday_evening_or_saturday">平日晚間＋週六</option>
            </select>
          </label>
          <label class="field">
            <span>時間資料</span>
            <select id="scheduleSelect">
              <option value="all">全部</option>
              <option value="known">只看有上課時間</option>
              <option value="unknown">只看時間未定</option>
            </select>
          </label>
          <label class="field">
            <span>排序</span>
            <select id="sortSelect">
              <option value="name">課名</option>
              <option value="department">系所</option>
              <option value="grade">年級</option>
              <option value="teacher">教師</option>
              <option value="credits">學分</option>
              <option value="course_code">課號</option>
            </select>
          </label>
        </div>
        <div class="exact-section-block">
          <div class="filter-label-row"><strong>精確節次</strong><span class="muted small">可複選；符合其中任一節次即可</span></div>
          <div id="sectionChips" class="chip-grid"></div>
        </div>
      </details>

      <div class="toolbar search-toolbar">
        <div id="activeFilterText" class="muted small">未套用額外條件</div>
        <div class="toolbar-actions">
          <button id="resetFiltersBtn" class="secondary">清除條件</button>
          <button id="applyFiltersBtn">套用篩選</button>
        </div>
      </div>
    </section>

    <section class="results-column">
      <div class="section-head wrap">
        <div>
          <h2>搜尋結果</h2>
          <span id="resultCount" class="muted"></span>
        </div>
        <div class="pager">
          <button id="prevPageBtn" class="secondary">上一頁</button>
          <span id="pageText" class="muted small"></span>
          <button id="nextPageBtn" class="secondary">下一頁</button>
        </div>
      </div>
      <div id="status" class="status">載入中…</div>
      <div id="courseList" class="course-list"></div>
    </section>
  </main>

  <template id="courseTemplate">
    <article class="course-card">
      <div class="course-main">
        <div class="title-row">
          <h3 class="course-name"></h3>
          <span class="badge req-badge"></span>
        </div>
        <p class="course-name-en muted small"></p>
        <p class="course-meta"></p>
        <p class="meeting-text"></p>
        <div class="course-tags"></div>
      </div>
      <div class="course-actions">
        <a class="outline-link" target="_blank" rel="noopener">官方課綱</a>
        <button class="add-btn">加入課表</button>
      </div>
    </article>
  </template>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
