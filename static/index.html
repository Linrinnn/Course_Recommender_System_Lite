<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>輔大課程查找 Lite+</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">FJU Course Recommender Lite+</p>
        <h1>輔大課程查找與排課</h1>
        <p id="termText" class="muted">讀取學期資料中…</p>
      </div>
      <button id="refreshBtn" class="secondary">重新抓取課程</button>
    </header>

    <section class="panel search-panel">
      <div class="filter-grid">
        <label class="field wide">
          <span>關鍵字</span>
          <input id="searchInput" type="search" placeholder="課名、教師、課號、系所" autocomplete="off" />
        </label>
        <label class="field">
          <span>教師</span>
          <input id="teacherInput" type="text" placeholder="例如：王小明" />
        </label>
        <label class="field">
          <span>系所／年級</span>
          <input id="departmentInput" type="text" placeholder="例如：資訊工程" />
        </label>
        <label class="field">
          <span>班別</span>
          <input id="classInput" type="text" placeholder="甲、乙或班名" />
        </label>
        <label class="field">
          <span>星期</span>
          <select id="weekdaySelect">
            <option value="">全部星期</option>
            <option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option>
            <option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="7">星期日</option>
          </select>
        </label>
        <label class="field">
          <span>節次</span>
          <input id="sectionInput" type="text" placeholder="例如：D3" />
        </label>
        <label class="field">
          <span>必／選修</span>
          <select id="reqSelect">
            <option value="">全部</option>
            <option value="必">只看必修</option>
            <option value="選">只看選修</option>
          </select>
        </label>
        <label class="field compact">
          <span>最低學分</span>
          <input id="minCreditsInput" type="number" min="0" max="30" step="0.5" placeholder="0" />
        </label>
        <label class="field compact">
          <span>最高學分</span>
          <input id="maxCreditsInput" type="number" min="0" max="30" step="0.5" placeholder="不限" />
        </label>
        <label class="field">
          <span>排序</span>
          <select id="sortSelect">
            <option value="name">課名</option>
            <option value="teacher">教師</option>
            <option value="credits">學分</option>
          </select>
        </label>
        <label class="check-field">
          <input id="timedOnlyCheck" type="checkbox" />
          <span>只看有上課時間</span>
        </label>
      </div>
      <div class="toolbar">
        <button id="searchBtn">搜尋</button>
        <button id="resetFiltersBtn" class="secondary">清除條件</button>
      </div>
    </section>

    <section class="panel preference-panel">
      <div class="section-head wrap">
        <div>
          <h2>推薦偏好</h2>
          <p class="muted small">只做規則評分，不呼叫 AI。分數是排序參考，不代表課程品質。</p>
        </div>
        <label class="switch-row"><input id="recommendMode" type="checkbox" checked /> 啟用推薦排序</label>
      </div>
      <div class="preference-grid">
        <label class="check-field"><input id="avoidEarlyCheck" type="checkbox" /> 避開 D1 早八</label>
        <label class="check-field"><input id="avoidFridayCheck" type="checkbox" /> 避開星期五</label>
        <label class="check-field"><input id="compactCheck" type="checkbox" checked /> 偏好課表集中、少空堂</label>
        <label class="field">
          <span>偏好教師</span>
          <input id="preferredTeacherInput" type="text" placeholder="可留空" />
        </label>
      </div>
    </section>

    <section class="layout">
      <div class="results-column">
        <div class="section-head wrap">
          <div>
            <h2>課程</h2>
            <span id="resultCount" class="muted"></span>
          </div>
          <div class="pager">
            <button id="prevPageBtn" class="secondary">上一頁</button>
            <span id="pageText" class="muted small"></span>
            <button id="nextPageBtn" class="secondary">下一頁</button>
          </div>
        </div>
        <div id="status" class="status">載入中…</div>
        <div id="courseList" class="course-list"></div>
      </div>

      <aside class="panel schedule-panel">
        <div class="section-head wrap">
          <div>
            <h2>課表方案</h2>
            <p id="planSummary" class="muted small"></p>
          </div>
        </div>
        <div class="plan-toolbar">
          <select id="planSelect"></select>
          <button id="newPlanBtn" class="secondary">新增</button>
          <button id="renamePlanBtn" class="secondary">改名</button>
          <button id="deletePlanBtn" class="text-btn danger">刪除</button>
        </div>
        <div id="conflictBox" class="conflict-box hidden"></div>
        <div id="selectedList" class="selected-list"></div>
        <div class="export-grid">
          <button id="copyPlanBtn" class="secondary">複製文字</button>
          <button id="csvBtn" class="secondary">匯出 CSV</button>
          <button id="icsBtn" class="secondary">匯出 ICS</button>
          <button id="clearBtn" class="text-btn danger">清空方案</button>
        </div>
      </aside>
    </section>

    <section class="panel timetable-panel">
      <div class="section-head wrap">
        <div>
          <h2>週課表</h2>
          <p class="muted small">依輔大 D1～E4 節次顯示；同一格若有兩門課會標示衝突。</p>
        </div>
      </div>
      <div id="timetableWrap" class="timetable-wrap"></div>
    </section>
  </main>

  <template id="courseTemplate">
    <article class="course-card">
      <div class="course-main">
        <div class="title-row">
          <h3 class="course-name"></h3>
          <span class="badge req-badge"></span>
          <span class="badge score-badge hidden"></span>
        </div>
        <p class="course-meta"></p>
        <p class="meeting-text"></p>
        <p class="recommend-reason small muted hidden"></p>
      </div>
      <div class="course-actions">
        <a class="outline-link" target="_blank" rel="noopener">大綱</a>
        <button class="add-btn">加入課表</button>
      </div>
    </article>
  </template>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
