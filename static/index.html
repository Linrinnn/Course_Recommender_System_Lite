<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>輔大選課工具</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="shell product-shell">
    <nav class="app-rail" aria-label="主要導覽">
      <div class="rail-brand" aria-label="輔大選課">F<span>輔大選課</span></div>
      <div class="rail-navigation">
        <button type="button" id="allCoursesTab" class="rail-item selected" aria-pressed="true">
          <span class="rail-icon" aria-hidden="true">⌕</span><span class="rail-label">探索課程</span>
        </button>
        <button type="button" id="favoritesTab" class="rail-item" aria-pressed="false">
          <span class="rail-icon" aria-hidden="true">☆</span><span class="rail-label">我的收藏</span>
          <span id="favoriteCount" class="rail-count">0</span>
        </button>
        <button type="button" id="openScheduleBtn" class="rail-item schedule-trigger">
          <span class="rail-icon" aria-hidden="true">▦</span><span class="rail-label">我的課表</span>
          <span id="scheduleCount" class="rail-count">0</span>
        </button>
      </div>
      <div class="rail-bottom"><span class="rail-online-indicator" aria-hidden="true"></span> 課綱資料</div>
    </nav>
    <div class="app-content">
    <header class="hero">
      <div class="hero-identity">
        <div class="hero-copy">
          <div class="hero-breadcrumb">課程管理 <span aria-hidden="true">/</span> <strong>探索</strong></div>
          <h1>課程探索</h1>
          <p id="termText" class="muted small">讀取學期資料中…</p>
        </div>
      </div>
      <div class="hero-actions">
        <span class="header-help">挑選課程，安排你的一週。</span>
        <button id="refreshBtn" class="text-btn" title="重新讀取課程資料">↻ <span>重新整理</span></button>
      </div>
    </header>

    <button id="filterBackdrop" class="filter-backdrop" type="button" aria-label="關閉篩選面板" tabindex="-1"></button>
    <div class="workspace-layout">
    <aside class="panel search-panel" id="filterPanel" aria-label="課程篩選條件">
      <div class="filter-heading">
        <div>
          <div class="filter-eyebrow">FILTERS</div>
          <h2>篩選條件</h2>
        </div>
        <button type="button" id="closeFiltersBtn" class="text-btn close-filters" aria-label="關閉篩選">✕</button>
      </div>
      <p class="filter-intro">調整條件後將自動更新結果</p>
      <div class="quick-filter-grid">
        <label class="field"><span>系所</span>
          <input id="departmentLookup" type="search" list="departmentSuggestions" autocomplete="off" placeholder="搜尋系名或代碼" aria-label="搜尋系所" />
          <datalist id="departmentSuggestions"></datalist>
          <select id="departmentSelect" hidden><option value="">全部系所</option></select>
        </label>
        <div class="field"><span>年級（可複選）</span>
          <select id="gradeSelect" hidden><option value="">全部年級</option></select>
          <div id="gradeChips" class="chip-grid" aria-label="年級複選"></div>
        </div>
        <label class="field"><span>班級</span><select id="classSelect"><option value="">全部班級</option></select></label>
        <label class="field"><span>開課部別</span><select id="divisionSelect"><option value="">全部部別</option></select></label>
        <label class="field"><span>學制／修課層級</span><select id="studyLevelSelect"><option value="">全部層級</option></select></label>
        <div class="field"><span>星期（可複選）</span>
          <select id="weekdaySelect" hidden><option value="">全部星期</option><option value="1">星期一</option><option value="2">星期二</option><option value="3">星期三</option><option value="4">星期四</option><option value="5">星期五</option><option value="6">星期六</option><option value="7">星期日</option></select>
          <div id="weekdayChips" class="chip-grid" aria-label="星期複選"></div>
        </div>
        <label class="field"><span>節次</span><select id="sectionSelect"><option value="">全部節次</option></select></label>
        <label class="field"><span>教室</span>
          <input id="roomLookup" type="search" list="roomSuggestions" autocomplete="off" placeholder="搜尋教室代碼" aria-label="搜尋教室" />
          <datalist id="roomSuggestions"></datalist>
          <select id="roomSelect" hidden><option value="">全部教室</option></select>
        </label>
        <label class="field"><span>學分</span><select id="creditsSelect"><option value="">不限學分</option></select></label>
        <label class="field"><span>必／選修</span><select id="reqSelect"><option value="">全部</option></select></label>
      </div>

      <details class="advanced-filter" id="advancedFilters">
        <summary>更多篩選條件 <span id="advancedCount" class="badge neutral-badge">0</span></summary>

        <div class="filter-group">
          <h3>基本條件</h3>
          <div class="filter-grid advanced-grid">
            <label class="field"><span>課程標籤</span><select id="courseTagSelect"><option value="">全部標籤</option></select></label>
            <label class="field"><span>教師</span><input id="teacherInput" list="teacherOptions" placeholder="輸入教師姓名" /><datalist id="teacherOptions"></datalist></label>
            <label class="field"><span>上課時段</span><select id="timeOfDaySelect">
              <option value="all">不限</option><option value="daytime">日間 D 節</option><option value="evening">晚間 E 節</option><option value="weekday_evening_or_saturday">平日晚間＋週六</option>
            </select></label>
            <label class="field"><span>時間資料</span><select id="scheduleSelect"><option value="all">全部</option><option value="known">只看有上課時間</option><option value="unknown">只看時間未定</option></select></label>
          </div>
          <div class="exact-section-block"><div class="filter-label-row"><strong>精確節次</strong><span class="muted small">可複選，符合其中任一節次</span></div><div id="sectionChips" class="chip-grid"></div></div>
        </div>

        <div class="filter-group enriched-filter-group">
          <div class="filter-label-row"><h3>原專案進階欄位</h3><span id="enrichedCoverageText" class="muted small"></span></div>
          <div class="filter-grid advanced-grid">
            <label class="field enriched-field"><span>授課語言</span><select id="teachingLanguageSelect"><option value="">全部</option></select></label>
            <label class="field enriched-field"><span>教材語言</span><select id="materialLanguageSelect"><option value="">全部</option></select></label>
            <label class="field enriched-field"><span>教學方式</span><select id="teachingMethodSelect"><option value="">全部</option></select></label>
            <label class="field enriched-field"><span>評量方式</span><select id="assessmentSelect"><option value="">全部</option></select></label>
            <label class="field enriched-field"><span>評量類型</span><select id="assessmentStyleSelect">
              <option value="all">不限</option><option value="no_exams">無考試</option><option value="exam">考試為主</option><option value="writing">書面為主</option><option value="presentation">報告為主</option><option value="practical">實作為主</option><option value="participation">參與為主</option>
            </select></label>
            <label class="field enriched-field"><span>線上教學</span><select id="onlineTeachingSelect">
              <option value="all">不限</option><option value="physical_only">純實體</option><option value="has_online">含線上</option><option value="sync">同步線上</option><option value="async">非同步線上</option><option value="both">同步＋非同步</option>
            </select></label>
            <label class="field enriched-field"><span>課程能力／議題</span><select id="relationSelect"><option value="">全部</option></select></label>
            <label class="field enriched-field"><span>先修關鍵字</span><input id="prerequisiteInput" placeholder="例如：程式設計、微積分" /></label>
            <label class="field"><span>索引狀態</span><select id="detailIndexedSelect"><option value="all">全部課程</option><option value="yes">只看完整索引</option><option value="no">只看尚未索引</option></select></label>
            <label class="field"><span>排序</span><select id="sortSelect"><option value="relevance">相關度</option><option value="name">課名</option><option value="department">系所</option><option value="grade">年級</option><option value="teacher">教師</option><option value="credits">學分</option><option value="course_code">課號</option></select></label>
          </div>
          <div class="criterion-row">
            <label class="field"><span>教學方式判定</span><select id="teachingMethodCriterionSelect"><option value="dominant">主要方式</option><option value="minimum">至少達比例</option></select></label>
            <label class="field"><span>最低比例</span><input id="teachingMethodMinInput" type="number" min="0" max="100" value="20" /></label>
            <label class="field"><span>評量方式判定</span><select id="assessmentCriterionSelect"><option value="dominant">主要方式</option><option value="minimum">至少達比例</option></select></label>
            <label class="field"><span>最低比例</span><input id="assessmentMinInput" type="number" min="0" max="100" value="20" /></label>
          </div>
        </div>
      </details>

      <div class="toolbar search-toolbar">
        <div class="toolbar-actions"><button id="resetFiltersBtn" class="secondary">清除全部</button><button id="applyFiltersBtn">查看結果</button></div>
      </div>
    </aside>

    <section class="results-column" id="resultsPanel" aria-label="搜尋結果">
      <div class="search-primary">
        <div class="search-input-wrap">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <label class="field search-field">
            <span>快速搜尋</span>
            <input id="searchInput" type="search" placeholder="搜尋課名、課號、教師或系所" autocomplete="off" />
          </label>
          <kbd class="search-shortcut" aria-label="快速搜尋快捷鍵">/</kbd>
        </div>
        <button id="searchBtn">搜尋</button>
      </div>
      <div class="results-head">
        <div class="results-title">
          <span class="section-kicker">COURSES</span>
          <div class="results-title-line">
            <h2 id="resultsHeading">課程列表</h2>
            <span id="resultCount" class="results-count muted small"></span>
          </div>
        </div>
        <div class="results-tools">
          <button type="button" id="mobileFiltersBtn" class="secondary mobile-filters" aria-controls="filterPanel" aria-expanded="false">篩選條件 <span aria-hidden="true">☷</span></button>
          <div class="pager"><button id="prevPageBtn" class="secondary" aria-label="上一頁">上一頁</button><span id="pageText" class="muted small"></span><button id="nextPageBtn" class="secondary" aria-label="下一頁">下一頁</button></div>
        </div>
      </div>
      <div class="course-view-toolbar">
        <div class="active-filters-wrap">
          <span class="summary-dot" aria-hidden="true"></span>
          <span id="activeFilterText" class="muted small">尚未套用篩選條件</span>
        </div>
        <div class="view-actions">
          <button type="button" id="conflictFreeBtn" class="quiet-action" aria-pressed="false" title="排除與目前課表衝堂的課程">避免衝堂</button>
        </div>
      </div>
      <div class="course-list-head" aria-hidden="true">
        <span>課程資訊</span><span>授課教師</span><span>上課時間與教室</span><span>學分</span><span class="head-actions">操作</span>
      </div>
      <div id="viewMessage" class="view-message hidden" role="status"></div>
      <div id="status" class="status">載入中…</div>
      <div id="courseList" class="course-list"></div>
    </section>
    </div>
    </div>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <div class="detail-dialog-inner">
      <div class="section-head">
        <div class="detail-head-label"><span class="section-kicker">COURSE DETAILS</span><h2 id="detailTitle">課程完整資料</h2></div>
        <button id="closeDetailBtn" class="secondary detail-close" aria-label="關閉詳情面板">✕</button>
      </div>
      <div class="detail-actions"><a id="detailOfficialLink" class="detail-official-link" target="_blank" rel="noopener">在輔大官方課綱查看 ↗</a></div>
      <div id="detailContent" class="detail-content"></div>
    </div>
  </dialog>

  <template id="courseTemplate">
    <article class="course-card">
      <div class="course-main">
        <div class="title-row">
          <button type="button" class="favorite-btn" aria-label="加入收藏" aria-pressed="false" title="收藏這門課">☆</button>
          <h3 class="course-name"></h3>
        </div>
        <p class="course-name-en muted small"></p>
        <p class="course-meta"></p>
        <div class="course-tags"><span class="badge req-badge"></span><span class="badge index-badge"></span></div>
      </div>
      <div class="course-teacher-cell">
        <span class="course-teacher"></span>
        <span class="course-class-label"></span>
      </div>
      <div class="course-time-cell"><span class="meeting-text"></span></div>
      <div class="course-credit-cell"><span class="course-credits"></span></div>
      <div class="course-actions">
        <button class="detail-btn secondary" title="查看課程詳細資料">詳情</button>
        <a class="outline-link" target="_blank" rel="noopener" title="開啟官方課綱" aria-label="開啟官方課綱">↗</a>
        <button class="add-btn">加入</button>
      </div>
    </article>
  </template>

  <script src="/static/schedule-modal.js"></script>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
