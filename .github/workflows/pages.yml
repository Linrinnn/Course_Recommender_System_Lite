name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'static/**'
      - 'catalog.py'
      - 'app.py'
      - 'build_pages.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore available course detail cache
        uses: actions/cache/restore@v4
        with:
          path: data_runtime
          key: fju-pages-115-1-latest
          restore-keys: |
            fju-pages-115-1-

      - name: Build static Pages site
        run: python build_pages.py

      - name: Save last-known-good course cache
        uses: actions/cache/save@v4
        with:
          path: data_runtime
          key: fju-pages-115-1-${{ github.run_id }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
