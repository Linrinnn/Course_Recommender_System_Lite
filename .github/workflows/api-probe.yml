name: Probe FJU course scopes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe official outline API
        shell: python
        run: |
          import json, urllib.parse, urllib.request, urllib.error, time

          base = "https://travellerlink.fju.edu.tw/Outline/api"
          hy, ht, lcid = 115, 1, 1028
          sco_types = [0, 1, 2, 10, 20, 100, 200, 300, 400, 500, 600, 700, 800, 900, 999]

          def get(endpoint, **params):
              url = f"{base}/{endpoint}?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 FJU-Course-Recommender-Diagnostic/1.0",
                  "Accept": "application/json,text/plain,*/*",
              })
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return r.status, json.loads(r.read().decode("utf-8"))
              except urllib.error.HTTPError as e:
                  try:
                      body = e.read().decode("utf-8", "replace")
                  except Exception:
                      body = ""
                  return e.code, body
              except Exception as e:
                  return None, repr(e)

          for sco in sco_types:
              status, payload = get(
                  "OutlineQuery/OutlineStudentQuery",
                  scoTyp=sco, hy=hy, ht=ht, PageNumber=1, PageSize=1, lcid=lcid
              )
              summary = {}
              if isinstance(payload, dict):
                  result = payload.get("result") or {}
                  summary = {
                      "statusCode": payload.get("statusCode"),
                      "totalPages": result.get("totalPages"),
                      "totalRows": result.get("totalRows"),
                      "count": result.get("count"),
                      "keys": list(result.keys()) if isinstance(result, dict) else None,
                      "first": (result.get("result") or [None])[0] if isinstance(result, dict) else None,
                  }
              else:
                  summary = {"body": str(payload)[:500]}
              print("LIST", sco, status, json.dumps(summary, ensure_ascii=False, default=str))

              status2, payload2 = get(
                  "OutlineQuery/CheckQueryAvailable",
                  scoTyp=sco, hy=hy, ht=ht, PageNumber=1, PageSize=1, lcid=lcid
              )
              if isinstance(payload2, dict):
                  compact = {k: payload2.get(k) for k in payload2.keys()}
              else:
                  compact = str(payload2)[:500]
              print("AVAILABLE", sco, status2, json.dumps(compact, ensure_ascii=False, default=str))
              time.sleep(0.5)

          # Audit the full scoTyp=100 listing to explain any count lost by normalization.
          all_rows = []
          page_size = 100
          status, first_payload = get(
              "OutlineQuery/OutlineStudentQuery",
              scoTyp=100, hy=hy, ht=ht, PageNumber=1, PageSize=page_size, lcid=lcid
          )
          if status == 200 and isinstance(first_payload, dict):
              result = first_payload.get("result") or {}
              total_pages = int(result.get("totalPages") or 0)
              all_rows.extend(result.get("result") or [])
              for page in range(2, total_pages + 1):
                  st, pl = get(
                      "OutlineQuery/OutlineStudentQuery",
                      scoTyp=100, hy=hy, ht=ht, PageNumber=page, PageSize=page_size, lcid=lcid
                  )
                  if st != 200 or not isinstance(pl, dict):
                      print("FULL_PAGE_FAILURE", page, st, str(pl)[:300])
                      continue
                  all_rows.extend((pl.get("result") or {}).get("result") or [])
              ids = [row.get("jonCouSn") for row in all_rows]
              missing_id = [row for row in all_rows if not row.get("jonCouSn")]
              missing_name = [row for row in all_rows if not str(row.get("couCNa") or "").strip()]
              unique_ids = {x for x in ids if x is not None}
              terms = {}
              done = 0
              for row in all_rows:
                  terms[str(row.get("term"))] = terms.get(str(row.get("term")), 0) + 1
                  done += int(bool(row.get("isDone")))
              print("FULL100", json.dumps({
                  "rows": len(all_rows),
                  "unique_ids": len(unique_ids),
                  "missing_id": len(missing_id),
                  "missing_name": len(missing_name),
                  "missing_name_rows": missing_name[:10],
                  "terms": terms,
                  "isDone_true": done,
              }, ensure_ascii=False, default=str))

          # Probe the separate official latest-course page; this is a different source
          # from the outline API and may explain larger counts in third-party apps.
          try:
              req = urllib.request.Request(
                  "https://estu.fju.edu.tw/fjucourse/ava_form.asp",
                  headers={"User-Agent": "Mozilla/5.0 FJU-Course-Recommender-Diagnostic/1.0"}
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  body = response.read().decode("big5", "replace")
                  print("ESTU_PAGE", response.status, len(body), repr(body[:1800]))
          except Exception as exc:
              print("ESTU_PAGE_ERROR", repr(exc))
