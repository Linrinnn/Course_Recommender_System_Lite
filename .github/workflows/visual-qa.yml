name: Visual UI QA

on:
  pull_request:
    paths:
      - 'static/**'
      - 'tests/test_browser_mockup.py'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless Chromium
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify real desktop and mobile UI
        run: python tests/test_browser_mockup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-ui-desktop-mobile
          path: visual-qa/*.png
          if-no-files-found: ignore
