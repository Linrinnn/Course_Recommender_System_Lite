name: CI

on:
  push:
    branches: [main, lite-plus]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile app.py catalog.py build_catalog.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check browser JavaScript
        run: |
          node --check static/app.js
          node --check static/schedule.js
